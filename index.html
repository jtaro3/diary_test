<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日記メモ帳</title>
  <style>
    :root { color-scheme: light; --ink:#272727; --muted:#777; --line:#e6e6e6; --soft:#f7f7f7; --accent:#4e7a65; }
    * { box-sizing:border-box; }
    body { margin:0; background:#fbfbfb; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif; }
    main { width:min(780px,100%); margin:auto; padding:40px 20px 72px; }
    h1 { margin:0; font-size:28px; font-weight:600; letter-spacing:.04em; }
    .sub { margin:8px 0 32px; color:var(--muted); font-size:14px; }
    .entry-form, .entry { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; }
    .entry-form { margin-bottom:28px; }
    label { display:block; margin:0 0 7px; font-size:14px; font-weight:600; }
    input, textarea { width:100%; border:1px solid #d4d4d4; border-radius:8px; padding:10px 12px; font:inherit; color:inherit; background:#fff; }
    textarea { min-height:86px; resize:vertical; line-height:1.6; }
    .field { margin-top:16px; }
    .actions { display:flex; gap:10px; align-items:center; margin-top:20px; }
    button { border:0; border-radius:8px; padding:10px 16px; font:inherit; cursor:pointer; }
    .save { background:var(--accent); color:#fff; font-weight:600; }
    .cancel, .delete { background:var(--soft); color:var(--ink); }
    .cancel[hidden] { display:none; }
    .toolbar { display:flex; gap:12px; justify-content:space-between; align-items:center; margin:0 0 16px; }
    .toolbar h2 { margin:0; font-size:17px; }
    .toolbar input { width:210px; padding:8px 10px; font-size:14px; }
    .data-actions { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 28px; }
    .data-actions button { background:var(--soft); color:var(--ink); padding:8px 12px; font-size:14px; }
    #import-file { display:none; }
    #entries { display:grid; gap:12px; }
    .entry-head { display:flex; justify-content:space-between; align-items:center; gap:12px; padding-bottom:12px; border-bottom:1px solid var(--line); }
    .date { font-size:16px; font-weight:600; }
    .entry-body { display:grid; gap:16px; padding-top:16px; }
    .entry-body h3 { margin:0 0 5px; font-size:13px; color:var(--muted); font-weight:600; }
    .entry-body p { margin:0; white-space:pre-wrap; line-height:1.65; }
    .empty { padding:34px 12px; color:var(--muted); text-align:center; }
    @media (max-width:560px) { main{padding-top:28px}.toolbar{align-items:stretch;flex-direction:column}.toolbar input{width:100%}.entry-form,.entry{padding:16px} }
  </style>
</head>
<body>
  <main>
    <h1>日記メモ帳</h1>
    <p class="sub">日付ごとに、気軽に記録します。</p>
    <form class="entry-form" id="diary-form">
      <input type="hidden" id="editing-id">
      <label for="date">日付</label>
      <input id="date" type="date" required>
      <div class="field"><label for="events">今日あったこと</label><textarea id="events" placeholder="今日あったことを書いてください"></textarea></div>
      <div class="field"><label for="feelings">感じたこと</label><textarea id="feelings" placeholder="感じたことを書いてください"></textarea></div>
      <div class="field"><label for="tomorrow">明日したいこと</label><textarea id="tomorrow" placeholder="明日したいことを書いてください"></textarea></div>
      <div class="actions"><button class="save" type="submit">保存する</button><button class="cancel" id="cancel" type="button" hidden>編集をやめる</button></div>
    </form>
    <div class="data-actions">
      <button id="export" type="button">日記を書き出す</button>
      <button id="import" type="button">日記を読み込む</button>
      <input id="import-file" type="file" accept="application/json,.json">
    </div>
    <div class="toolbar"><h2>これまでの日記</h2><input id="search" type="search" placeholder="日付・言葉で探す"></div>
    <section id="entries" aria-live="polite"></section>
  </main>
  <script>
    const key = 'simple-diary-entries';
    const $ = id => document.getElementById(id);
    const form = $('diary-form');
    const fields = ['date','events','feelings','tomorrow'];
    let entries = JSON.parse(localStorage.getItem(key) || '[]');
    $('date').value = new Date().toISOString().slice(0, 10);
    const escapeHtml = value => value.replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const displayDate = value => new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date(value + 'T00:00:00'));
    function render() {
      const q = $('search').value.trim().toLowerCase();
      const selected = entries.filter(e => [e.date,e.events,e.feelings,e.tomorrow].join(' ').toLowerCase().includes(q)).sort((a,b) => b.date.localeCompare(a.date));
      $('entries').innerHTML = selected.length ? selected.map(e => `<article class="entry"><div class="entry-head"><span class="date">${displayDate(e.date)}</span><div><button type="button" class="cancel" onclick="editEntry('${e.id}')">編集</button> <button type="button" class="delete" onclick="deleteEntry('${e.id}')">削除</button></div></div><div class="entry-body"><div><h3>今日あったこと</h3><p>${escapeHtml(e.events || '—')}</p></div><div><h3>感じたこと</h3><p>${escapeHtml(e.feelings || '—')}</p></div><div><h3>明日したいこと</h3><p>${escapeHtml(e.tomorrow || '—')}</p></div></div></article>`).join('') : '<p class="empty">まだ日記がありません。</p>';
    }
    function resetForm() { form.reset(); $('editing-id').value=''; $('date').value=new Date().toISOString().slice(0,10); $('cancel').hidden=true; }
    form.addEventListener('submit', event => { event.preventDefault(); const entry = Object.fromEntries(fields.map(id => [id,$(id).value.trim()])); const editing = $('editing-id').value; if (editing) { entries = entries.map(e => e.id === editing ? {...entry,id:editing} : e); } else { entries.push({...entry,id:crypto.randomUUID()}); } localStorage.setItem(key,JSON.stringify(entries)); resetForm(); render(); });
    $('cancel').addEventListener('click', resetForm);
    $('search').addEventListener('input', render);
    $('export').addEventListener('click', () => {
      const data = JSON.stringify(entries, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `diary-${new Date().toISOString().slice(0, 10)}.json`;
      link.click();
      URL.revokeObjectURL(link.href);
    });
    $('import').addEventListener('click', () => $('import-file').click());
    $('import-file').addEventListener('change', async event => {
      const file = event.target.files[0];
      if (!file) return;
      try {
        const imported = JSON.parse(await file.text());
        if (!Array.isArray(imported) || !imported.every(entry => entry && typeof entry.date === 'string')) throw new Error();
        const merged = new Map(entries.map(entry => [entry.id, entry]));
        imported.forEach(entry => {
          const id = entry.id || crypto.randomUUID();
          merged.set(id, { ...entry, id });
        });
        entries = [...merged.values()];
        localStorage.setItem(key, JSON.stringify(entries));
        render();
        alert(`${imported.length}件の日記を読み込みました。`);
      } catch {
        alert('日記ファイルを読み込めませんでした。');
      } finally {
        event.target.value = '';
      }
    });
    window.editEntry = id => { const e=entries.find(entry=>entry.id===id); fields.forEach(field => $(field).value=e[field]); $('editing-id').value=id; $('cancel').hidden=false; window.scrollTo({top:0,behavior:'smooth'}); };
    window.deleteEntry = id => { if(confirm('この日記を削除しますか？')) { entries=entries.filter(e=>e.id!==id); localStorage.setItem(key,JSON.stringify(entries)); render(); } };
    render();
  </script>
</body>
</html>
